<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            /*everything should stack vertidcally and be centered*/
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            /* also put the canvas in the center vercially*/
            height: 100vh;
        }
        .title {
            color: #ffffff;
            font-family: "Garamond", serif;
            margin-bottom: 20px;
            position: absolute;
            top: 20px;
        }
        canvas {
            border: 3px solid #383838;
            border-radius: 5px;
            background-color: #1b1a22;
        }
    </style>
</head>
<body>
    <h1 class="title">Just normal pong</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <!-- Order matters: each file can only use things from files loaded above it -->
    <script src="src/core.js"></script>
    <script src="src/input.js"></script>
    <script src="src/physics.js"></script>
    <script src="src/player.js"></script>
    <script src="src/ball.js"></script>
    <script src="src/components/component.js"></script>
    <script src="src/components/linear-movement.js"></script>
    <script src="src/components/basic-bounce.js"></script>
    <script src="src/components/never-slower.js"></script>
    <script src="src/components/collide-ball.js"></script>
    <script src="src/components/magnus-effect.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
